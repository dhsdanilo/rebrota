<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebrota</title>
<meta name="theme-color" content="#0F1A17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rebrota">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<!-- ?v= sobe a cada mudança: sem isso o navegador serve o arquivo velho do
     cache e a correção parece não ter funcionado -->
<link rel="stylesheet" href="app.css?v=38">
</head>
<body>

<header class="topo">
  <!-- o nome é a porta de casa: leva sempre para a tela de entrada.
       A marca é um toco cortado com um broto saindo da lateral — o que o sítio
       faz sozinho, e o que o app existe para ajudar a fazer. -->
  <h1><button type="button" class="topo-nome" data-acao="voltar-inicio">
    <!-- Duas cores porque são duas coisas: a casca é o que foi cortado, o verde
         é o que voltou. O tronco sai pela base de propósito — ele não acaba. -->
    <svg class="marca-rebrota" viewBox="0 0 24 24" aria-hidden="true">
      <!-- tronco em contorno, topo redondo, aberto embaixo: ele não acaba -->
      <path d="M4.6 25V13.4a3.6 3.6 0 0 1 7.2 0V25" fill="none"
            stroke="var(--casca)" stroke-width="2.1" stroke-linecap="round"/>
      <!-- o broto sai da lateral e abre em duas folhas -->
      <path d="M11.9 16.4c.8-3.9 1.9-6.1 3.5-8.2" fill="none"
            stroke="var(--rebrota)" stroke-width="2" stroke-linecap="round"/>
      <path d="M15.5 8.4c-2.7-.5-4.1-2.2-4.2-5 2.7.2 4.1 1.9 4.2 5z" fill="var(--rebrota)"/>
      <path d="M15.5 8.4c.4-3.1 2.1-4.8 5-5.1.1 3-1.6 4.7-5 5.1z" fill="var(--rebrota)"/>
    </svg>
    Rebrota</button>
    <!-- diz ONDE você está, não o que vai fazer: executar, organizar e analisar
         são três coisas diferentes, e nenhuma delas pode ser prometida aqui -->
    <span class="topo-modo">mesa</span></h1>
  <!-- o espaço à direita fica vago de propósito: é onde a estação
       meteorológica vai entrar, quando existir -->
</header>

<main class="quadro">

  <aside class="coluna-projetos">
    <div class="coluna-cabeca">
      <h2><button type="button" class="cabeca-link" data-abrir="projetos">Projetos</button></h2>
      <button type="button" id="btNovoProjeto" class="bt-forte">novo</button>
    </div>
    <ul class="lista-projetos" id="listaProjetos"></ul>

    <div class="coluna-cabeca coluna-cabeca-secao">
      <h2>Avulsas</h2>
      <button type="button" id="btNovaAvulsa" class="bt-fraco">nova</button>
    </div>
    <ul class="lista-projetos" id="listaAvulsas"></ul>

    <ul class="lista-projetos" id="listaProposta"></ul>

    <div class="coluna-cabeca coluna-cabeca-secao">
      <h2>Fora do meu controle</h2>
    </div>
    <ul class="lista-projetos" id="listaPendencias"></ul>

    <div class="coluna-cabeca coluna-cabeca-secao">
      <h2>Roadmap</h2>
    </div>
    <ul class="lista-projetos" id="listaRoadmap"></ul>
  </aside>

  <section class="palco" id="palco"></section>

</main>

<!-- frente de campo: no celular isto é o app inteiro e a tela inicial -->
<section class="execucao" id="execucao" hidden>
  <button type="button" class="execucao-sair" id="btSairCampo" aria-label="voltar para a análise">×</button>
  <div id="campoTela"></div>
</section>

<!-- as três ferramentas de arquivo, juntas e fora do caminho: entrar, sair e
     anotar sobre o próprio app. Nenhuma delas é trabalho do sítio. -->
<div class="ferramentas">
  <button type="button" class="bt-icone" id="btExportar" aria-label="exportar"
          title="Baixar tudo em JSON — o paraquedas: você nunca fica refém do app.">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 3v9"/><path d="M6.5 8.5 10 12l3.5-3.5"/><path d="M4 15.5h12"/>
    </svg>
  </button>
  <button type="button" class="bt-icone" id="btImportar" aria-label="importar"
          title="Ler um arquivo JSON. Nada é gravado antes de você ver o que muda.">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 12V3"/><path d="M6.5 6.5 10 3l3.5 3.5"/><path d="M4 15.5h12"/>
    </svg>
  </button>
  <input type="file" id="arquivoImportar" accept="application/json" hidden>
  <!-- bancada provisória: ver o app em tamanho de celular sem celular -->
  <a class="bt-icone" href="celular.html" target="_blank" aria-label="prova de celular"
     title="Abrir o app em tamanho de celular, para lapidar o desenho.">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="6" y="2.5" width="8" height="15" rx="1.8"/><path d="M9 15.2h2"/>
    </svg>
  </a>
  <button type="button" class="bilhete-bt" id="btBilhete" aria-label="anotar sobre o app">✎</button>
</div>

<div class="bilhete" id="bilhete" hidden>
  <div class="bilhete-topo">
    <strong>Anotações sobre o app</strong>
    <button type="button" class="bilhete-x" id="btFecharBilhete" aria-label="fechar">×</button>
  </div>
  <textarea id="bilheteTexto" rows="10"
    placeholder="o que incomodou, o que faltou, o que você mudaria&#10;&#10;grava sozinho"></textarea>
  <div class="bilhete-baixo">
    <button type="button" class="bt-forte" id="btCopiarBilhete">copiar para a conversa</button>
    <button type="button" class="bt-fraco" id="btApagarBilhete">apagar</button>
    <span class="aviso" id="bilheteAviso"></span>
  </div>
</div>

<script src="modelo.js?v=38"></script>
<script src="motor.js?v=38"></script>
<script src="dados.js?v=38"></script>
<script src="campo.js?v=38"></script>
<script src="app.js?v=38"></script>
</body>
</html>
