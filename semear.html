<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebrota</title>
<meta name="theme-color" content="#0F1A17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rebrota">
<link rel="manifest" href="semear.webmanifest">
<link rel="icon" href="icone-semente.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-semente.svg">
<link rel="stylesheet" href="app.css?v=72">
</head>
<body class="so-semear">
<!-- A tela da esposa: plantar sementes, e ler o sítio. Ela não escreve nada
     além da semente — cada ideia vira um evento no diário dela e aparece na
     mesa dele como semente. "O sítio" é o catálogo inteiro em leitura (§35):
     o que está em andamento, a fila, as avulsas, as sementes de todos. -->

<header class="topo">
  <h1><span class="topo-nome">
    <svg class="marca-rebrota" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4.6 25V13.4a3.6 3.6 0 0 1 7.2 0V25" fill="none"
            stroke="var(--casca)" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M11.9 16.4c.8-3.9 1.9-6.1 3.5-8.2" fill="none"
            stroke="var(--rebrota)" stroke-width="2" stroke-linecap="round"/>
      <path d="M15.5 8.4c-2.7-.5-4.1-2.2-4.2-5 2.7.2 4.1 1.9 4.2 5z" fill="var(--rebrota)"/>
      <path d="M15.5 8.4c.4-3.1 2.1-4.8 5-5.1.1 3-1.6 4.7-5 5.1z" fill="var(--rebrota)"/>
    </svg>
    Rebrota</span>
    <span class="topo-modo">sementeira</span></h1>
  <!-- a outra página: o sítio em leitura. O botão diz para onde vai. -->
  <button type="button" class="semear-ir" id="btIr" data-ir="sitio">o sítio</button>
</header>

<main class="semear-pagina" id="paginaPlantar">
  <p class="semear-frase" id="frase"></p>

  <textarea id="texto" class="semear-texto" rows="6"
    placeholder="a ideia, e tudo que você pensou sobre ela — pode ditar"></textarea>
  <!-- "já existe?": enquanto ela escreve, o que se parece com a ideia — para a
       pergunta ser respondida na hora, sem ir procurar. Não impede nada. -->
  <div class="semear-parece" id="parece" hidden></div>
  <button type="button" class="c-acao" id="btPlantar">plantar</button>
  <p class="aviso semear-aviso" id="aviso"></p>

  <section class="semear-lista">
    <h2>Plantadas por aqui</h2>
    <ul id="lista"></ul>
  </section>

  <section class="semear-nuvem" id="nuvemCaixa">
    <h2>Sincronização</h2>
    <p class="nuvem-como" id="nuvemComo">Para as sementes chegarem na mesa, cole aqui o token que o Dan te passar. Fica só neste aparelho.</p>
    <input type="password" id="nuvemToken" placeholder="cole o token" autocomplete="off">
    <div class="bilhete-baixo">
      <button type="button" class="bt-forte" id="btLigarNuvem">ligar</button>
      <button type="button" class="bt-fraco" id="btSincronizarAgora" hidden>sincronizar agora</button>
      <button type="button" class="bt-linha" id="btDesligarNuvem" hidden>desligar</button>
    </div>
    <p class="aviso nuvem-estado" id="nuvemEstado"></p>
  </section>
</main>

<!-- O SÍTIO — leitura. Nenhum botão aqui escreve: os únicos toques abrem e
     fecham cartões. O que ela vê é o que veria ao lado dele no PC; o que fica
     fora é a conversa dele com o app (a oferta do momento, as recusas). -->
<main class="semear-pagina semear-sitio" id="paginaSitio" hidden>
  <input type="search" id="busca" class="semear-busca" placeholder="procurar em projetos, tarefas e sementes" autocomplete="off">
  <div id="sitio"></div>
</main>

<script src="modelo.js?v=72"></script>
<script src="sync.js?v=72"></script>
<script src="semear.js?v=72"></script>
</body>
</html>
